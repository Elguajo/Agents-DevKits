    status: active
    inputs:
      - task request
      - available product context
    outputs:
      - product specification
      - acceptance criteria
      - remaining risks
    verification:
      produces: []
    capabilities:
      required: []
      preferred:
        - repository
      optional: []
    references: []
    origin:
      type: local
      repository: Elguajo/Agents-DevKits
    owns: product intent, scope, states, constraints, and acceptance criteria
    use_when: requirements are ambiguous, broad, or incomplete
    produces: implementation-ready product specification
    non_goals:
      - technical architecture
      - framework selection
      - visual art direction
    handoff_to:
      - solution-architecture
    related:
      - feature-development
    invocation:
      - model
    triggers:
