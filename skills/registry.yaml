schema_version: 2
updated: '2026-08-27'
purpose: Machine-readable routing contract. SKILL.md remains authoritative for execution instructions.
precedence:
  - explicit_user_request
  - project_instructions
  - task_specific_source_of_truth
  - existing_project_conventions
  - generic_skill_guidance
status_values:
  - active
  - experimental
  - deprecated
invocation_values:
  - user
  - model
routing:
  tier_values:
    - auto
    - propose
    - ask
  defaults:
    model: auto
    user: ask
  overrides:
    - skill: feature-development
      tier: propose
trigger_values:
  - task.ambiguous
  - task.product
  - task.ux_research
  - task.information_architecture
  - task.journey_mapping
  - task.existing_repository
  - task.project_knowledge
  - task.bug
