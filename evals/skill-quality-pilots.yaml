schema_version: 1
purpose: Deliberate with-skill versus no-skill pilot definitions. These are not deterministic routing scenarios or model-benchmark results.
pilots:
  - id: roadmap-status-detail-choice
    skill: roadmap-status
    baseline: without-skill
    task: Show the existing project's roadmap. The request does not say whether a basic or detailed view is wanted.
    assertions:
      - Uses a native two-option basic/detailed choice when the runtime supports structured user input; otherwise asks with checklist choices before presenting a roadmap.
      - A detailed response enumerates only canonically documented ADR decisions, unfinished tasks, acceptance gates, and queued phases.
      - When canonical queue or phase evidence is unavailable or contradictory, states the boundary instead of claiming an exhaustive detailed map.
      - Does not create a new plan, ADR, or completion claim while presenting status.
  - id: debugging-root-cause
    skill: debugging
    baseline: without-skill
    task: A settings save intermittently overwrites the user's latest value. Reproduce the defect, identify the root cause, implement the smallest fix, and add focused regression coverage.
    assertions:
      - Separates observed evidence from hypotheses.
      - Identifies a concrete root cause before proposing a fix.
      - Adds or updates a regression test for the observed failure.
  - id: feature-development-cross-layer
    skill: feature-development
    baseline: without-skill
    task: Add saved filters to an existing list view with durable storage, an API boundary, and visible UI states. Produce the smallest complete implementation plan for an unfamiliar repository.
    assertions:
      - States product assumptions and affected boundaries.
      - Selects only specialists justified by the stated risks.
      - Defines focused verification and residual risks.
  - id: code-review-regression
    skill: code-review
    baseline: without-skill
    task: Review a proposed change that retries an API request after timeout but can duplicate a payment submission. Report only actionable findings with evidence.
    assertions:
      - Identifies duplicate side-effect risk and its triggering path.
      - Distinguishes a confirmed finding from an unverified concern.
      - Does not replace review with an implementation rewrite.
  - id: release-check-evidence
    skill: release-check
    baseline: without-skill
    task: Decide whether a completed authentication change is ready to ship when unit tests pass, browser verification was unavailable, and no security review was performed.
    assertions:
      - Does not report SHIP from unit tests alone.
      - Separates executed evidence from unavailable or missing checks.
      - Names the minimum next action for a ship decision.
  - id: visual-qa-reference-boundary
    skill: visual-qa
    baseline: without-skill
    task: Compare a rendered pricing page with its approved design reference and report visual deviations without diagnosing unrelated application behavior.
    assertions:
      - Reports visual evidence tied to the reference.
      - Separates visual defects from functional hypotheses.
      - Identifies the appropriate follow-up owner for non-visual concerns.
  - id: progressive-context-change-adoption
    skill: progressive-context-change-adoption
    baseline: without-skill
    task: A ready NodeFlow 3.45 Progressive Context Kit project receives an audit and proposed plan requiring a canonical data contract, a control .max fixture, the first standalone .max-to-Blender path with Corona Physical and opacity, progress/cancellation/validation/recovery, a shared 3ds Max exporter contract, then remaining findings and later large-scene migration. Reconcile this into existing PCK state without implementation.
    assertions:
      - Treats audit and plan assertions as evidence rather than canonical truth.
      - Dispositions covered and conflicting findings, preserving completed history and stopping for material decisions.
      - Creates dependency-ordered work with exactly one active phase and cold source references rather than copied audit text.
  - id: progressive-context-audit-only
    skill: progressive-context-change-adoption
    baseline: without-skill
    task: A ready Progressive Context Kit project receives only a detailed technical audit. Incorporate accepted findings into the canonical roadmap and next phase without requiring a separate implementation-plan document or implementing code.
    assertions:
      - Derives only the minimum dependency-aware plan supported by the audit and repository evidence.
      - Marks unsupported or decision-worthy recommendations instead of inventing plan detail.
      - Keeps the audit cold and updates canonical owners minimally.
  - id: progressive-context-completed-project-change-request
    skill: progressive-context-change-adoption
    baseline: without-skill
    task: Every phase in a completed Progressive Context Kit project is marked complete, and a new audit identifies required reliability work. Reconcile the new request without rewriting prior phase records.
    assertions:
      - Appends a change-request phase sequence instead of reopening or rewriting completed history.
      - Keeps prior Completion Records as historical evidence.
      - Establishes exactly one active phase only after accepted work is dependency ordered.
  - id: progressive-context-covered-findings
    skill: progressive-context-change-adoption
    baseline: without-skill
    task: An active Progressive Context Kit project receives an audit whose recommendations are already represented by roadmap items and the current phase. Reconcile the audit without duplicating planned work.
    assertions:
      - Classifies mapped recommendations as ALREADY_COVERED or MERGED with canonical references.
      - Does not create duplicate phases, tasks, or copied audit text.
      - Retains only the source references useful to current execution.
  - id: progressive-context-adr-conflict
    skill: progressive-context-change-adoption
    baseline: without-skill
    task: A new audit recommends reversing a completed consequential architecture decision recorded in an ADR for an active Progressive Context Kit project. Reconcile it without silently replacing that decision.
    assertions:
      - Marks the contradiction NEEDS_DECISION and states the affected ADR and consequence.
      - Preserves current Architecture as factual until implementation changes it.
      - Stops before planning or implementation that assumes an unapproved replacement direction.
  - id: non-progressive-project-state-change-adoption
    skill: project-state-change-adoption
    baseline: without-skill
    task: A legacy project declares README scope, docs/architecture.md as current system truth, GitHub milestones as planned work, and a current issue. Reconcile a new audit and implementation plan into those owners without adopting PCK or implementing code.
    assertions:
      - Identifies and respects the project's declared owners instead of inventing PCK files.
      - Classifies material findings and retains precise audit references rather than copying the report.
      - Stops for unresolved material choices and hands implementation to the project's current execution workflow.
