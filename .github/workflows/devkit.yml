name: Agents DevKits validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  library:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - if: runner.os == 'Windows'
        shell: powershell
        run: choco install ripgrep --no-progress -y
      - shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          python3() { python "$@"; }
          export -f python3
          python scripts/gate.py
  devkit-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell implementation
        run: ./devkit/scripts/test.sh

  devkit-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [pwsh, powershell]
    steps:
      - uses: actions/checkout@v4
      - name: Validate native PowerShell implementation
        shell: ${{ matrix.shell }}
        run: .\devkit\setup.ps1 test
